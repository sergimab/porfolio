<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cursor del sitio. La punta de la flecha está en (10.37, 3.09) del lienzo de
  64, así que el hotspot va desplazado: a 32px reales cae en (5, 2). Ver el
  bloque "cursor" en globals.css.

  El halo se consigue pintando la forma dos veces: primero rellena Y trazada en
  color claro (queda por debajo, asomando solo por fuera) y luego rellena en
  oscuro encima. Es lo mismo que paint-order="stroke fill", pero sin depender de
  que el rasterizador lo soporte. Engrosar el trazo sin este truco se comería la
  silueta, porque el trazo va centrado sobre el contorno.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
