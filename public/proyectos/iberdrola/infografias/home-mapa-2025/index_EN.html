  <script>
    // En móvil el atributo autoplay se ignora a menudo (iOS en modo de bajo
    // consumo, ahorro de datos, o el vídeo embebido en un iframe), así que el
    // mapa se quedaba congelado en el primer fotograma. Se fuerza el play al
    // entrar en pantalla y, si aun así lo rechaza, al primer gesto del usuario.
    (function () {
      var video = document.querySelector('.video-mapa');
      if (!video) return;

      function play() {
        var promise = video.play();
        if (promise && typeof promise.catch === 'function') promise.catch(function () {});
      }

      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
          if (entries[0].isIntersecting) {
            play();
            io.disconnect();
          }
        }, { threshold: 0.25 });
        io.observe(video);
      } else {
        play();
      }

      ['touchstart', 'click'].forEach(function (evt) {
        document.addEventListener(evt, function once() {
          if (video.paused) play();
          document.removeEventListener(evt, once);
        }, { passive: true });
      });
    })();
  </script>
</body>
</html>
